name: Build Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deployment is handled by Cloudflare Pages (Git integration on the
# kilc-website project): every push to main builds and publishes
# kilc.co.uk, and every pull request gets a preview URL. This workflow
# only type-checks and builds, so a broken change shows up on the PR.
# See docs/CLOUDFLARE_PAGES.md.

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Astro types
        run: npx astro sync

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Astro site
        run: npm run build
